<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var cache = localStorage.getItem("crm_branding_cache");
          if (cache) {
            var data = JSON.parse(cache);
            if (data && data.companyName) {
              document.title = data.companyName;
            }
            if (data && data.companyFavicon) {
              var existingIcons = document.querySelectorAll("link[rel*='icon']");
              for (var i = 0; i < existingIcons.length; i++) {
                existingIcons[i].parentNode.removeChild(existingIcons[i]);
              }
              var link = document.createElement("link");
              link.id = "app-favicon";
              link.rel = "icon";
              link.href = data.companyFavicon;
              document.head.appendChild(link);
            }
          }
        } catch (e) {}
      })();
    </script>
    <link id="app-favicon" rel="icon" href="/vite.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Best-effort baseline for crawlers that don't execute JS at all — every page
         overrides these via react-helmet-async (see PageSeo.tsx) once React mounts. -->
    <meta name="description" content="Shop online — quality products, fast delivery." />
