<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/vite.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Best-effort baseline for crawlers that don't execute JS at all — every page
         overrides these via react-helmet-async (see PageSeo.tsx) once React mounts. -->
    <meta name="description" content="Shop online — quality products, fast delivery." />
    <meta property="og:type" content="website" />
    <title>Storra</title>
    <script>
      (function() {
        try {
          var cache = localStorage.getItem("crm_branding_cache");
          if (cache) {
            var data = JSON.parse(cache);
            if (data.companyName) {
              document.title = data.companyName;
            }
            if (data.companyFavicon) {
              var link = document.getElementById("app-favicon") || document.querySelector("link[rel='icon']") || document.querySelector("link[rel='shortcut icon']");
              if (link) {
                var absoluteFaviconUrl = new URL(data.companyFavicon, window.location.origin).href;
                if (link.href !== absoluteFaviconUrl) {
                  link.href = data.companyFavicon;
                }
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CUace-zS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DaLYWHGc.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
